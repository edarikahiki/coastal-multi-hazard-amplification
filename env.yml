name: multi-hazard
channels:
  - conda-forge

dependencies:
  # Core
  - python=3.11
  - pip>=20
  - setuptools
  - certifi
  - ca-certificates
  - openssl

  # Jupyter / dev
  - ipykernel
  - ipython
  - ipywidgets
  - jupyter
  - jupyterlab>=4
  - jupyterlab_widgets
  - nb_conda_kernels
  - nodejs
  - voila
  - pre-commit
  - python-lsp-server
  - jupyterlab-lsp
  - jupyterlab_code_formatter
  - jupyterlab_execute_time
  - jupyter-resource-usage
  - jupyter-panel-proxy

  # Scientific stack
  - numpy
  - scipy
  - pandas
  - xarray
  - netcdf4
  - bottleneck
  - numcodecs
  - zarr
  - fsspec
  - pyarrow
  - scikit-image
  - scikit-learn
  - numba

  # Dask (PINNED to avoid dask/distributed mismatch)
  # Keep <2025.3.0 due to odc-geo issue noted in your coastal env
  - dask>=2025.2.0,<2025.3.0
  - distributed>=2025.2.0,<2025.3.0
  - dask-jobqueue
  - dask-geopandas
  - dask-labextension

  # Geo stack
  - geopandas>=0.11
  - shapely
  - pyproj
  - pyogrio
  - rasterio
  - rioxarray
  - gdal
  - cartopy
  - contextily
  - geojson
  - mercantile
  - pooch
  - tqdm

  # Spatial stats / indexing
  - esda
  - libpysal
  - h3-py
  - h3pandas

  # STAC / cloud geospatial
  - pystac>=1.12.1
  - odc-stac
  - stackstac
  - stactools
  - planetary-computer
  - adlfs
  - gcsfs
  - intake
  - obstore

  # Viz / HoloViz (keep on conda-forge)
  - matplotlib
  - pillow
  - seaborn
  - colorcet
  - param
  - panel
  - holoviews
  - geoviews
  - hvplot
  - datashader
  - bokeh<3.5
  - jupyter_bokeh
  - ipyleaflet
  - ipympl
  - lonboard
  - descartes
  - selenium

  # Utilities
  - requests
  - pyyaml
  - git
  - ffmpeg
  - boltons
  - cattrs
  - ciso8601
  - beautifulsoup4
  - msgspec
  - cchardet

  # pip-only / prefer pip
  - pip:
      # IMPORTANT: install these with --no-deps (see commands below)
      - hydromt==1.3.0
      - hydromt-sfincs==2.0.0rc1
      - coastpy
      - antimeridian
      - duckdb
      - imagecodecs
      - "ibis-framework[duckdb,geospatial]"
      - more-itertools
      - xvec
      - stac-geoparquet